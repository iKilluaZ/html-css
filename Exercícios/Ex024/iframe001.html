<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 550px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!-- Tamanho padrão do Iframe: 300x150 -->
    <!-- Scrolling: auto, yes ou no -->
    <!-- Frameborder: 0 ou qualquer valor -->
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com/" frameborder="0" scrolling="no"></iframe> para aprender a programar</p>
    
    <p>O site do <iframe src="https://google.com.br/" frameborder="0"><a href="https://google.com.br/" target="_blank"> Google</a></iframe> também é muito legal. Pena que não funciona dentro do iframe.</p>
    
    <p>O repositório do Guanabara está disponível em: <iframe src="https://gustavoguanabara.github.io/" frameborder="0"></iframe></p>
</body>
</html>
