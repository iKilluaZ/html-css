<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
            background-color: rgb(196, 196, 196);
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        col.cnome {
            background-color: rgb(255, 204, 204);
        }
        col.csexo {
            background-color: rgb(204, 255, 204);
        }
        col.cprof {
            background-color: rgb(204, 204, 255);
        }
    </style>
</head>
<body>
    <h1>Agrupando Colunas com Colgroup</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>Feminino</td>
            <td>30</td>
            <td>Engenheira</td>
        </tr>`
        <tr>
            <td>João</td>
            <td>Masculino</td>
            <td>25</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Feminino</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>Masculino</td>
            <td>35</td>
            <td>Gerente</td>
        </tr>
        <tr>
            <td>Carla</td>
            <td>Feminino</td>
            <td>32</td>
            <td>Analista</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>Masculino</td>
            <td>27</td>
            <td>Desenvolvedor</td>
        </tr>
    </table>
</body>
</html>
